name: unagi-dev

services:
  app:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      - DJANGO_SETTINGS_MODULE=unagi.settings_dev
      - SECRET_KEY=django-insecure-dev-only-not-for-production
      - DATABASE_URL=psql://admin:admin@db:5432/unagi_dev
    ports:
      - "8002:8000"
    volumes:
      - ./unagi:/app
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: unagi_dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
