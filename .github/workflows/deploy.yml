name: Deploy

on:
  push:
    branches: [main]

jobs:
  test:
    uses: LucasBeley/unagi/.github/workflows/django.yml@main

  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/deploy/unagi
            git pull
            docker compose -f docker-compose.prod.yml up --build -d
            docker image prune -f
