name: unagi-prod

services:
  app:
    build: .
    environment:
      - DJANGO_SETTINGS_MODULE=unagi.settings
    env_file: unagi/.env
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:12
    env_file: unagi/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
